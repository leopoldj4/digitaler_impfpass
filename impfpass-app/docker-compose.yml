services:
  postgres:
    image: postgres:15
    container_name: impfpass_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: impfpass
      POSTGRES_PASSWORD: impfpass
      POSTGRES_DB: impfpass_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
